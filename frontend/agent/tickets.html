<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tickets - Support CRM</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">
            <span>Support CRM</span>
            <span class="brand-badge" style="background-color: var(--warning-light); color: var(--warning); border-color: var(--warning-border);">Agent Desk</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="tickets.html" class="active">All Tickets</a>
            <a href="customers.html">Customers</a>
            <a href="../admin/dashboard.html">Reports</a>
        </div>
        <div class="nav-user">
            <div class="user-badge">
                <span id="nav-user-name">Staff</span>
                <span style="font-size: 0.75rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">AGENT</span>
            </div>
            <button onclick="Auth.logout()" class="btn btn-secondary btn-sm">Sign Out</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Support Tickets Queue</h1>
                <p class="page-subtitle">Manage, assign, and resolve customer support issues</p>
            </div>
        </div>

        <div class="card">
            <!-- Filter Bar -->
            <div class="card-header" style="flex-wrap: wrap; gap: 1rem;">
                <div style="display: flex; gap: 0.75rem; flex: 1; min-width: 260px;">
                    <input type="text" id="agent-search-input" class="form-control" placeholder="Search by ticket title, customer name, or ID..." oninput="AgentApp.filterTickets()">
                </div>
                <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                    <select id="agent-filter-status" class="form-control" style="width: auto;" onchange="AgentApp.filterTickets()">
                        <option value="">All Statuses</option>
                        <option value="open">Open</option>
                        <option value="in-progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                    </select>

                    <select id="agent-filter-priority" class="form-control" style="width: auto;" onchange="AgentApp.filterTickets()">
                        <option value="">All Priorities</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Subject</th>
                            <th>Customer</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Assigned Agent</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="agent-tickets-tbody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading ticket queue...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Support CRM Platform &bull; Staff Workspace</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/agent.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            AgentApp.loadTicketsList();
        });
    </script>
</body>
</html>
